# Baut das Spiel automatisch bei jedem Hochladen (Push):
#  1. Selbsttest: Das Spiel läuft im Zeitraffer ohne Bildschirm und muss fehlerfrei bleiben.
#  2. Android-APK und Windows-Version werden gebaut und unter "Artifacts" zum Download angeboten.
name: Spiel testen und bauen

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    name: Testen + Android/Windows bauen
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Godot einrichten
        run: |
          mkdir -p ~/.local/share/godot/export_templates/ ~/.config/
          if [ -d /root/.config/godot ] && [ ! -d ~/.config/godot ]; then cp -r /root/.config/godot ~/.config/godot; fi
          if [ ! -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/
          fi
          if [ ! -f /root/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
              -keystore /root/debug.keystore -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          fi

      - name: Projekt importieren
        run: |
          timeout 300 godot --headless --import 2>&1 | tee import.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error" import.log; then
            echo "::error::Ein Skript hat einen Fehler (siehe oben)."
            exit 1
          fi

      - name: Selbsttest (Spiel automatisch laufen lassen)
        run: |
          timeout 150 godot --headless --path . -- --smoke 2>&1 | tee smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error" smoke.log; then
            echo "::error::Im Spiel ist ein Skript-Fehler aufgetreten (siehe oben)."
            exit 1
          fi
          grep -q "SMOKE_TEST_OK" smoke.log

      - name: Bildschirmfotos aufnehmen (nur zur Kontrolle)
        continue-on-error: true
        run: |
          apt-get update -qq && apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          mkdir -p screenshots
          timeout 120 xvfb-run -a -s "-screen 0 720x1280x24" godot --rendering-driver opengl3 --resolution 720x1280 --path . -- --screenshots=$PWD/screenshots 2>&1 | grep -v "^$" | tail -20
          ls -la screenshots

      - name: Bildschirmfotos hochladen
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Bildschirmfotos
          path: screenshots/

      - name: Android-APK bauen
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/Hofkueche.apk
          ls -la build/android
          test -f build/android/Hofkueche.apk

      - name: Windows-Version bauen
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows" build/windows/Hofkueche.exe
          ls -la build/windows
          test -f build/windows/Hofkueche.exe

      - name: APK zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Hofkueche-Android
          path: build/android/Hofkueche.apk

      - name: Windows-Version zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Hofkueche-Windows
          path: build/windows/Hofkueche.exe

      - name: Zusammenfassung
        if: always()
        continue-on-error: true
        run: |
          grep -E "Selbsttest|SMOKE" smoke.log || true
          for f in screenshots/*_klein.jpg; do
            echo "BILD_START $f"
            base64 -w0 "$f"
            echo ""
            echo "BILD_ENDE"
          done
