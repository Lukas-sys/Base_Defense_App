# Baut das Spiel automatisch bei jedem Hochladen (Push):
#  1. Selbsttest: Das Spiel läuft eine Minute ohne Bildschirm und muss fehlerfrei bleiben.
#  2. Android-APK und Windows-Version werden gebaut und unter "Artifacts" zum Download angeboten.
name: Spiel testen und bauen

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    name: Testen + Android/Windows bauen
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Godot einrichten
        run: |
          mkdir -p ~/.local/share/godot/export_templates/ ~/.config/
          if [ -d /root/.config/godot ] && [ ! -d ~/.config/godot ]; then cp -r /root/.config/godot ~/.config/godot; fi
          if [ ! -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/
          fi
          if [ ! -f /root/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
              -keystore /root/debug.keystore -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          fi

      - name: Projekt importieren
        run: timeout 300 godot --headless --import || true

      - name: Selbsttest (Spiel 1 Minute automatisch laufen lassen)
        run: |
          timeout 300 godot --headless --path . -- --smoke 2>&1 | tee smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error" smoke.log; then
            echo "::error::Im Spiel ist ein Skript-Fehler aufgetreten (siehe oben)."
            exit 1
          fi
          grep -q "SMOKE_TEST_OK" smoke.log

      - name: Android-APK bauen
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/Holzwacht.apk
          ls -la build/android
          test -f build/android/Holzwacht.apk

      - name: Windows-Version bauen
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows" build/windows/Holzwacht.exe
          ls -la build/windows
          test -f build/windows/Holzwacht.exe

      - name: APK zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Holzwacht-Android
          path: build/android/Holzwacht.apk

      - name: Windows-Version zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Holzwacht-Windows
          path: build/windows/Holzwacht.exe
