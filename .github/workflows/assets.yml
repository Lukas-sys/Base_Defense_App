# Holt kostenlose 3D-Modelle (KayKit von Kay Lousberg, Lizenz CC0, frei nutzbar)
# und legt sie ins Projekt. Läuft nur, wenn diese Datei geändert oder der Lauf von Hand gestartet wird.
name: 3D-Modelle holen

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/assets.yml

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: KayKit-Pakete herunterladen
        run: |
          set -e
          mkdir -p /tmp/kk assets/kaykit
          for pack in Restaurant-Bits City-Builder-Bits Furniture-Bits; do
            echo "=== $pack"
            git clone -q --depth 1 "https://github.com/KayKit-Game-Assets/KayKit-$pack-1.0.git" "/tmp/kk/$pack"
            echo "Ordner:"; find "/tmp/kk/$pack" -maxdepth 3 -type d | grep -v "/.git" | head -30
            src=$(find "/tmp/kk/$pack" -type d \( -iname "gltf" -o -iname "glb" \) | head -1)
            if [ -z "$src" ]; then echo "kein gltf/glb-Ordner"; continue; fi
            dest="assets/kaykit/$(echo $pack | tr 'A-Z' 'a-z')"
            mkdir -p "$dest"
            cp -r "$src"/. "$dest/"
            find "/tmp/kk/$pack" -maxdepth 2 -iname "LICENSE*" -exec cp {} "$dest/" \;
            echo "Dateien:"; ls "$dest" | tr '\n' ' '; echo
            du -sh "$dest"
          done

      - name: Ins Repository übernehmen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/kaykit
          if git diff --cached --quiet; then echo "Nichts Neues"; exit 0; fi
          git commit -m "KayKit-3D-Modelle (CC0) hinzugefügt"
          git push
